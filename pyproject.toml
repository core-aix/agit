[build-system]
# >=83 for GHSA/CVE coverage, not for a feature: below it, `MANIFEST.in` exclusions can be
# bypassed when building an sdist through a Unicode normalization collision (NFC vs NFD) on
# macOS APFS/HFS+ — so a file this project deliberately excludes could still ship. Releases are
# built on macOS runners, which is exactly the affected filesystem. The lockfile pins the
# resolved version for everything else; this is the floor the PEP 517 build environment gets.
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"

# Ship ONLY the import package (and its subpackages). Without this, setuptools'
# flat-layout auto-discovery scans every top-level directory and fails the build
# the moment a non-excluded one appears (e.g. `devtools/` for maintenance tooling):
# "Multiple top-level packages discovered in a flat-layout: ['devtools', 'agitrack']".
# Pinning the package set keeps the build stable as repo-root dirs come and go.
[tool.setuptools.packages.find]
include = ["agitrack*"]

# NOTE: `name` is the PyPI *distribution* name (what `pip install` takes). After
# the aGiT → aGiTrack rename, the distribution, the import package, and the
# installed command are all `agitrack` — `pip install agitrack` provides
# `import agitrack` and the `agitrack` command.
# `version` is managed by scripts/publish.sh (auto-incremented per release);
# 0.0.0 marks an unreleased working tree.
[project]
name = "agitrack"
version = "0.6.22"
description = "Interactive coding-agent CLI that commits AI changes to git with traceable metadata."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "aGiTrack contributors"}]
dependencies = [
    "prompt_toolkit>=3.0.52",
    "pyte>=0.8.2",
    "watchdog>=6.0",
    # Native-Windows only (#118): ConPTY bindings used to spawn the backend under a
    # pseudo-console. POSIX uses the stdlib ``pty`` module, so this is never installed there.
    "pywinpty>=2.0.13; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    # Parallel test execution (`pytest -n auto`). The suite is dominated by wall-clock waits
    # on subprocesses, pty drains and poll intervals rather than CPU, so distributing it
    # across cores turns a ~6-minute serial run into well under two. Every test is already
    # isolated (its own tmp_path, its own AGITRACK_CONFIG_DIR via the autouse fixture), which
    # is what makes this safe to switch on.
    "pytest-xdist>=3.6",
    # Coverage measured through pytest rather than by wrapping it in `coverage run`. With
    # xdist the tests execute in WORKER SUBPROCESSES, which a plain `coverage run` never
    # enters — it reported 10% and failed the floor while every test passed. pytest-cov starts
    # and merges coverage inside each worker, so the number is the real one.
    "pytest-cov>=6.0",
    "coverage>=7.14.1",
    "ruff>=0.9",
    "mypy>=1.13",
    "mypy-baseline>=0.7",
    "pre-commit>=4.0",
]
build = [
    "pyinstaller>=6.0",
]

[project.scripts]
agitrack = "agitrack.cli:main"

[project.urls]
Homepage = "https://github.com/core-aix/agitrack"
Repository = "https://github.com/core-aix/agitrack"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests whose PASS/FAIL depends on how fast the machine is are excluded by default — from the
# normal suite and therefore from CI, which runs a plain `pytest`. They measure wall-clock
# elapsed time, so a loaded runner or a coarse clock fails them without anything being wrong:
# Windows' monotonic() granularity once produced `assert 0.0500000000001819 <= 0.05`. They are
# kept, not deleted — they are the right tool when investigating a timing-specific problem.
# Run them deliberately with:  pytest -m timing
addopts = "-m 'not timing and not live' --dist loadgroup"
markers = [
    # Tests that fork a real pseudo-terminal. `--dist loadgroup` keeps every test carrying the
    # same `xdist_group` on ONE worker, which serializes them relative to each other while the
    # rest of the suite still spreads across cores. Without it, N workers each forking ptys
    # concurrently exhaust the OS pty pool — observed on a 14-core machine as
    # `test_spawn_pty_returns_handle_with_master_fd` failing and a worker dying, neither
    # reproducible in isolation. forkpty from a multi-threaded process is hazardous enough
    # (CPython warns about it) that bounding the concurrency is right regardless of the pool.
    "xdist_group: pin to one xdist worker (see --dist loadgroup); used for pty/fork tests",
    "timing: asserts on measured wall-clock time; excluded by default, run with `-m timing`",
    # Live tests call the REAL backend CLIs. They are the only thing that catches a backend
    # changing its output format under us — which no mock can, since the mocks assert the
    # shape we believed was true when we wrote them. Excluded by default because they need
    # the backend installed and authenticated, cost real tokens, and take seconds each.
    # Run with `pytest -m live` (each skips itself when its binary is absent).
    "live: calls a real backend CLI; excluded by default, run with `-m live`",
]

[tool.coverage.run]
source = ["agitrack"]
omit = ["tests/*"]
# The suite starts real threads (git worker, summary workers, the reactor's helpers), so
# coverage has to follow them or their lines read as dead. Worker-subprocess handling is
# pytest-cov's job — see the dev-dependency note.
concurrency = ["thread"]

[tool.coverage.report]
# A floor, not a target. CI measured 79% when this was introduced, so this fails only on a
# real REGRESSION while leaving room for a legitimate refactor to move coverage around.
# Raise it as coverage climbs; never lower it to make a red build green.
fail_under = 78


[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# The rule set is CHOSEN, not inherited. These four groups are ruff's historical defaults
# (pycodestyle errors E4/E7/E9 and pyflakes F), which is what this codebase has always been held
# to — the difference is that it now says so. Leaving `select` unset means the gate is whatever
# the installed ruff's defaults happen to be, and those move: ruff 0.16 widened them, so the
# routine dependabot bump 0.15.16 -> 0.16.2 turned CI red with 1222 findings across 33 new rules
# (FURB, RUF, PLW, SIM, UP...) without a line of this project changing. A lint gate that reinterprets
# itself on someone else's release schedule cannot be a required check. Adopting any of those rules
# is a deliberate decision to make here, one at a time, with the churn that implies.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Tests deliberately group some imports with the test sections they belong to.
"tests/*" = ["E402"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
# Pragmatic baseline for a codebase adopting mypy incrementally: type-check the
# package, surface real issues, but don't require full strictness yet. The
# pre-existing errors are held in a baseline (see CI) and burned down separately.
files = ["agitrack"]
